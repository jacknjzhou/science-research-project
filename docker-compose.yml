# 科研管理系统 · 全套服务一键编排（Docker Compose）
# 用法：docker compose up -d --build     浏览器访问 http://localhost:8080
# 说明：
#   · 2026-10-17 起后端为 Django（方案C，backend-django/）：migrate 拥有 schema，
#     启动时幂等播种演示数据；未实现契约端点由 stub 层返回合规占位（X-Stub: true）。
#   · 旧 Go/Node 后端已移除，源码快照见 git tag legacy-backend-20261017。
#   · 重新初始化：docker compose down -v 清空 pgdata 卷再 up。

name: eplugger-ark

services:
  backend:
    build:
      context: ./backend-django
      dockerfile: Dockerfile
    image: ark-django:0.1.0
    container_name: ark-backend
    environment:
      ARK_DATABASE_URL: postgres://ark:ark@postgres:5432/ark?sslmode=disable
      ARK_REDIS_ADDR: redis:6379
      ARK_JWT_SECRET: ${ARK_JWT_SECRET:-dev-secret-change-me-please-use-32-bytes-min!}
      # LLM（NewAPI OpenAI 兼容）：未配置时 AI 端点自动降级 REVIEW（不阻塞业务）
      ARK_LLM_BASE_URL: ${ARK_LLM_BASE_URL:-}
      ARK_LLM_API_KEY: ${ARK_LLM_API_KEY:-}
      ARK_LLM_MODEL: ${ARK_LLM_MODEL:-gpt-4o-mini}
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend            # 前端构建上下文自包含（契约 yaml 已随 frontend/ 提交）
      dockerfile: Dockerfile
    image: eplugger-frontend:0.1.0
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"                    # 对外统一入口：http://localhost:8080
    restart: unless-stopped

  # PostgreSQL 15：schema 将由 backend-django 的 Django migrations 接管（Phase 0）
  postgres:
    image: postgres:15-alpine
    container_name: ark-postgres
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ark
      POSTGRES_PASSWORD: ark
      POSTGRES_DB: ark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ark -d ark"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Redis 7：幂等键热存储（Idempotency-Key -> 首次响应快照，TTL 24h）、Celery broker
  redis:
    image: redis:7-alpine
    container_name: ark-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  minio-data:
