# 科研管理系统 · 基础设施一键编排（Docker Compose）
# 用法：docker compose up -d       浏览器访问 http://localhost:8080（前端需另行本地启动，或待 Phase 0 恢复 backend 服务）
# 说明：
#   · 2026-10-17 后端重写为 Django（方案 C）：Go+Gin 与 Node 后端已移除，
#     源码快照见 git tag legacy-backend-20261017；
#   · 后端重写计划/规格见 docs/superpowers/plans|specs/2026-10-17-backend-django-rewrite-*；
#   · Phase 0 就绪后本文件将恢复 backend 服务定义（backend-django + celery + svc-ai）；
#   · postgres/redis/minio 仍可独立使用，供 backend-django 本地开发；
#   · 重新初始化：docker compose down -v 清空 pgdata 卷再 up。

name: eplugger-ark

services:
  frontend:
    build:
      context: ./frontend            # 前端构建上下文自包含（契约 yaml 已随 frontend/ 提交）
      dockerfile: Dockerfile
    image: eplugger-frontend:0.1.0
    ports:
      - "8080:80"                    # 对外统一入口：http://localhost:8080
    restart: unless-stopped

  # PostgreSQL 15：schema 将由 backend-django 的 Django migrations 接管（Phase 0）
  postgres:
    image: postgres:15-alpine
    container_name: ark-postgres
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ark
      POSTGRES_PASSWORD: ark
      POSTGRES_DB: ark
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ark -d ark"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Redis 7：幂等键热存储（Idempotency-Key -> 首次响应快照，TTL 24h）、Celery broker
  redis:
    image: redis:7-alpine
    container_name: ark-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  minio-data:
