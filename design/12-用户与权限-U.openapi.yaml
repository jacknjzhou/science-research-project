openapi: 3.0.3
info:
  title: 科研管理系统 · 12 用户与权限 API（模块 U）
  version: "1.0.0"
  description: >-
    用户/角色/权限垂直 REST 契约。统一响应包裹 ApiResponse{code,message,data,traceId,timestamp}；
    分页 PageResult{list,total,page,size}；认证 Bearer JWT；写方法支持 Idempotency-Key。
    实体字段名与 DDL 列名一致（snake_case），但 password_hash 绝不出现在任何响应。
    授权由服务端 Casbin（RBAC）+ 数据域（ABAC：tenant_id/legal_entity_id/security_level）双重把关。
servers:
  - url: https://{host}/api/v1
    variables:
      host: { default: api.institute.example.com }
tags:
  - { name: auth,      description: 登录与当前用户能力（/auth/login、/auth/me） }
  - { name: user,      description: 用户 CRUD 与状态（仅 R-ADMIN 可写） }
  - { name: role,      description: 角色目录与用户授权 }
  - { name: notification, description: 站内通知中心（T8；铃铛轮询/收件箱/已读） }
  - { name: taskcenter, description: 任务中心与站内消息（T20；待办聚合/三 tab 摘要/点对点消息） }
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: 账号密码登录（bcrypt 校验，签发带数据域的 JWT）
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [auth]
      summary: 当前用户 + 角色 + 能力集合（前端按钮级鉴权依据）
      operationId: getMe
      responses:
        '200':
          description: 当前身份能力
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/users:
    get:
      tags: [user]
      summary: 用户列表（租户隔离 + 分页 + 状态/关键词筛选）
      operationId: listUsers
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, LOCKED, DISABLED] } }
        - { name: keyword, in: query, description: 匹配 username/real_name/email, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 分页用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list: { type: array, items: { $ref: '#/components/schemas/User' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [user]
      summary: 新建用户（写 password_hash=bcrypt，绑定 roles）
      operationId: createUser
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRequest' }
      responses:
        '200':
          description: 创建后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{id}:
    get:
      tags: [user]
      summary: 用户详情
      operationId: getUser
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [user]
      summary: 更新用户资料/状态（password 可选：给出即重设）
      operationId: updateUser
      parameters: [ { $ref: '#/components/parameters/PathId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [user]
      summary: 停用（软删 deleted=1，status→DISABLED）
      operationId: deleteUser
      parameters: [ { $ref: '#/components/parameters/PathId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { id: { type: integer, format: int64 }, deleted: { type: boolean } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/roles:
    get:
      tags: [role]
      summary: 角色目录（本租户）
      operationId: listRoles
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list: { type: array, items: { $ref: '#/components/schemas/Role' } }
  /admin/users/{id}/roles:
    post:
      tags: [role]
      summary: 给用户授予角色
      operationId: assignRole
      parameters: [ { $ref: '#/components/parameters/PathId' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role_id], properties: { role_id: { type: integer, format: int64 } } }
      responses:
        '200':
          description: 授权后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users/{id}/roles/{roleId}:
    delete:
      tags: [role]
      summary: 撤销用户的某角色
      operationId: revokeRole
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: 撤销后的用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/dicts:
    get:
      tags: [dict]
      summary: 字典目录分页（R-ADMIN；keyword 匹配 code/name）
      operationId: listDicts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - { name: keyword, in: query, schema: { type: string } }
      responses:
        '200':
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list: { type: array, items: { $ref: '#/components/schemas/Dict' } }
    post:
      tags: [dict]
      summary: 新建/按 code 更新字典（upsert；R-ADMIN）
      operationId: upsertDict
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictUpsert' }
      responses:
        '200':
          description: 字典
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Dict' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/dicts/{dictId}:
    get:
      tags: [dict]
      summary: 字典详情（含全部条目，含停用）
      operationId: getDict
      parameters: [ { name: dictId, in: path, required: true, schema: { type: integer, format: int64 } } ]
      responses:
        '200':
          description: 字典+条目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Dict'
                          - type: object
                            properties:
                              items: { type: array, items: { $ref: '#/components/schemas/DictItem' } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [dict]
      summary: 软删字典（deleted=1；条目随读随隐）
      operationId: deleteDict
      parameters:
        - { name: dictId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { id: { type: integer, format: int64 }, deleted: { type: boolean } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/dicts/{dictId}/items:
    post:
      tags: [dict]
      summary: 新建/按 (item_code, 生效期) 更新条目（upsert；R-ADMIN）
      operationId: upsertDictItem
      parameters:
        - { name: dictId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictItemUpsert' }
      responses:
        '200':
          description: 条目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DictItem' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/dicts/{dictId}/items/{itemId}:
    put:
      tags: [dict]
      summary: 编辑条目（label/parent/ext/i18n/sort/active/生效期）
      operationId: updateDictItem
      parameters:
        - { name: dictId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DictItemUpsert' }
      responses:
        '200':
          description: 条目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/DictItem' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [dict]
      summary: 删除条目（硬删，仅未被引用的叶子；R-ADMIN）
      operationId: deleteDictItem
      parameters:
        - { name: dictId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: object, properties: { id: { type: integer, format: int64 }, deleted: { type: boolean } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /dicts/{code}:
    get:
      tags: [dict]
      summary: 按 code 读取字典与生效条目（全员只读，业务下拉数据源）
      description: 仅返回 active=1 且在生效期内（effective_from<=today<=effective_to 或未设）的条目；按 sort_no,id 升序。
      operationId: getDictByCode
      parameters: [ { name: code, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: 字典+生效条目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Dict'
                          - type: object
                            properties:
                              items: { type: array, items: { $ref: '#/components/schemas/DictItem' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [notification]
      summary: 收件箱分页（T8；query typ=TODO|MESSAGE|WARNING 过滤，缺省全部）
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: typ
          in: query
          schema: { type: string, enum: [TODO, MESSAGE, WARNING] }
      responses:
        "200":
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/Notification' }

  /notifications/unread-count:
    get:
      tags: [notification]
      summary: 未读计数（T8；铃铛轮询）
      operationId: unreadCount
      responses:
        "200":
          description: 未读数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          count: { type: integer }

  /notifications/read-all:
    post:
      tags: [notification]
      summary: 全部已读（T8）
      operationId: markAllRead
      responses:
        "200":
          description: 更新条数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          updated: { type: integer }

  /notifications/{id}/read:
    post:
      tags: [notification]
      summary: 单条已读（T8）
      operationId: markRead
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 已读结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }

  /tasks:
    get:
      tags: [taskcenter]
      summary: 我的待办聚合（T20；未读 TODO 通知 + 我名下 PENDING 审批单，kind 区分）
      operationId: listMyTasks
      parameters:
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: 待办列表（kind=NOTIFICATION|APPROVAL）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/TaskItem' }
                          total: { type: integer }

  /tasks/summary:
    get:
      tags: [taskcenter]
      summary: 今日待办摘要（T20；三 tab 计数 todo/message/warning，todo 含 PENDING 审批单）
      operationId: tasksSummary
      responses:
        "200":
          description: 计数摘要
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          todo: { type: integer }
                          message: { type: integer }
                          warning: { type: integer }

  /messages:
    post:
      tags: [taskcenter]
      summary: 发送点对点站内消息（T20；type=MESSAGE）
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toUserIds, title]
              properties:
                toUserIds:
                  type: array
                  minItems: 1
                  items: { type: integer, format: int64 }
                title: { type: string }
                body: { type: string }
      responses:
        "200":
          description: 发送结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sent: { type: integer }
                          total: { type: integer }
    get:
      tags: [taskcenter]
      summary: 站内消息收件箱（T20；type=MESSAGE 过滤）
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/Notification' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
    Page: { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
    Size: { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
    PathId: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
  responses:
    BadRequest:
      description: 参数校验失败（40001）
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
    Unauthorized:
      description: 未认证（40101/40102）
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
    Forbidden:
      description: 越权（40301）
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
    NotFound:
      description: 不存在（40401）
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
    Conflict:
      description: 冲突（40901 用户名重复；40902 角色已授予）
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponse' } } }
  schemas:
    ApiResponse:
      type: object
      required: [code, message, traceId, timestamp]
      properties:
        code:      { type: integer }
        message:   { type: string }
        data:      { nullable: true }
        traceId:   { type: string }
        timestamp: { type: integer, format: int64 }
    PageResult:
      type: object
      properties:
        list:  { type: array, items: { type: object } }
        total: { type: integer, format: int64 }
        page:  { type: integer }
        size:  { type: integer }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        tenant_id: { type: integer, format: int64, nullable: true, description: 缺省 1（M0 单租户演示） }
    LoginResult:
      type: object
      properties:
        token_type:   { type: string, example: Bearer }
        access_token: { type: string }
        expires_in:   { type: integer, format: int64 }
    User:
      type: object
      description: 对外用户形状（DDL sys_user，剔除 password_hash，附 roles[]）。
      properties:
        id:                { type: integer, format: int64 }
        username:          { type: string }
        real_name:         { type: string }
        email:             { type: string, nullable: true }
        phone:             { type: string, nullable: true }
        staff_no:          { type: string, nullable: true }
        employment_status: { type: string, enum: [ONBOARD, RESIGNED, RETIRED, VISITING, GUEST, REHIRE] }
        security_level:    { type: string, enum: [PUBLIC, INTERNAL, SECRET, TOP_SECRET] }
        status:            { type: string, enum: [ACTIVE, LOCKED, DISABLED] }
        tenant_id:         { type: integer, format: int64 }
        legal_entity_id:   { type: integer, format: int64, nullable: true }
        roles:             { type: array, items: { type: string } }
        created_at:        { type: string, format: date-time }
        updated_at:        { type: string, format: date-time }
    UserRequest:
      type: object
      required: [username, real_name, password]
      properties:
        username:          { type: string }
        real_name:         { type: string }
        password:          { type: string, description: 明文，服务端 bcrypt 后落 password_hash }
        email:             { type: string, nullable: true }
        phone:             { type: string, nullable: true }
        staff_no:          { type: string, nullable: true }
        security_level:    { type: string, enum: [PUBLIC, INTERNAL, SECRET, TOP_SECRET] }
        employment_status: { type: string, enum: [ONBOARD, RESIGNED, RETIRED, VISITING, GUEST, REHIRE] }
        roles:             { type: array, items: { type: string }, description: 角色码 R-* 列表 }
    UserUpdateRequest:
      type: object
      properties:
        real_name:      { type: string }
        email:          { type: string, nullable: true }
        phone:          { type: string, nullable: true }
        security_level: { type: string, enum: [PUBLIC, INTERNAL, SECRET, TOP_SECRET] }
        status:         { type: string, enum: [ACTIVE, LOCKED, DISABLED] }
        password:       { type: string, nullable: true, description: 给出即重设口令 }
    Role:
      type: object
      properties:
        id:        { type: integer, format: int64 }
        code:      { type: string }
        name:      { type: string }
        is_builtin: { type: boolean }
        tenant_id: { type: integer, format: int64 }
    MeResponse:
      type: object
      properties:
        user:  { $ref: '#/components/schemas/User' }
        roles: { type: array, items: { type: string } }
        caps:  { type: array, items: { type: string }, description: '"<pathTemplate> <METHOD>"，源自 Casbin policy 命中角色' }
    Notification:
      type: object
      description: 站内通知/消息（T8/T20）
      properties:
        id: { type: integer, format: int64 }
        typ: { type: string, enum: [TODO, MESSAGE, WARNING] }
        title: { type: string }
        content: { type: string, nullable: true }
        bizRef: { type: string, nullable: true, description: 业务引用，如 expense/123 }
        readAt: { type: string, nullable: true }
        createdAt: { type: string }

    TaskItem:
      type: object
      description: 待办条目（T20；kind=NOTIFICATION 通知待办 / kind=APPROVAL 审批单待办）
      properties:
        kind: { type: string, enum: [NOTIFICATION, APPROVAL] }
        id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string, nullable: true }
        bizRef: { type: string, nullable: true }
        bizType: { type: string, nullable: true, description: kind=APPROVAL 时为 EXPENSE 等 }
        code: { type: string, nullable: true }
        amount: { type: string, nullable: true }
        status: { type: string, nullable: true }
        expenseType: { type: string, nullable: true }
        stepOrder: { type: integer, nullable: true }
        role: { type: string, nullable: true, description: 当前审批步骤角色 }
        createdAt: { type: string }

    Dict:
      type: object
      description: 数据字典（DDL sys_dict；PRD 2.8 由 R-ADMIN 维护）
      properties:
        id:         { type: integer, format: int64 }
        code:       { type: string, description: project_type/output_source/activity_type... }
        name:       { type: string }
        remark:     { type: string, nullable: true }
        tenant_id:  { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DictUpsert:
      type: object
      required: [code, name]
      properties:
        code:   { type: string, maxLength: 64 }
        name:   { type: string, maxLength: 128 }
        remark: { type: string, nullable: true }
    DictItem:
      type: object
      description: 字典条目（DDL sys_dict_item；支持树形/扩展属性/生效期/多语言）
      properties:
        id:             { type: integer, format: int64 }
        dict_id:        { type: integer, format: int64 }
        item_code:      { type: string }
        item_label:     { type: string }
        parent_id:      { type: integer, format: int64, nullable: true }
        ext:            { type: object, nullable: true, description: 附加属性（icon/color/ratio_limit 等，DDL ext_json） }
        i18n:           { type: object, nullable: true, description: 多语言（DDL i18n_json），本期存取不消费 }
        sort_no:        { type: integer }
        effective_from: { type: string, format: date, nullable: true }
        effective_to:   { type: string, format: date, nullable: true }
        active:         { type: boolean }
        tenant_id:      { type: integer, format: int64 }
    DictItemUpsert:
      type: object
      required: [item_code, item_label]
      properties:
        item_code:      { type: string, maxLength: 64 }
        item_label:     { type: string, maxLength: 128 }
        parent_id:      { type: integer, format: int64, nullable: true }
        ext:            { type: object, nullable: true }
        i18n:           { type: object, nullable: true }
        sort_no:        { type: integer }
        effective_from: { type: string, format: date, nullable: true }
        effective_to:   { type: string, format: date, nullable: true }
        active:         { type: boolean }
