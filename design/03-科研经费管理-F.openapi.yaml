    get:
      tags: [Dashboard]
      summary: 经费监督大屏数据聚合（一图一舱三预警，F-18，刷新<5s）
      operationId: fundingDashboard
      parameters:
        - name: legalEntityId
          in: query
          schema: { type: integer, format: int64 }
          description: 法人过滤（总院可空看合并视图，PRD 2.12）
        - name: fiscalYear
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: 大屏聚合数据（来自 OLAP/ClickHouse 只读投影）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FundingDashboard' }

  /funding/execution:
    get:
      tags: [Execution]
      summary: 项目经费执行率聚合（预算批复/到账/已用/冻结/剩余，两口径执行率）
      operationId: fundingExecution
      parameters:
        - name: dim
          in: query
          schema: { type: string, enum: [project, college, subject], default: project }
          description: 聚合维度（T23）：project=按项目明细；college=按学院分组；subject=按学科分组（返回 list[dimRow]）
        - name: projectId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 执行率聚合
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FundingExecution' }

  /funding/warnings:
    get:
      tags: [Execution]
      summary: 经费执行预警清单（惰性计算：执行率超阈值 + 结题窗口风险，竞品"三预警"确定性部分）
      operationId: fundingWarnings
      parameters:
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
          description: 可选过滤；缺省扫描全部 EXECUTING 项目
      responses:
        "200":
          description: 预警清单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/FundingWarning' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等键（UUID），服务端缓存去重；同一次重试返回同一结果
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: 页码（1-based）
      schema: { type: integer, default: 1, minimum: 1 }
    Size:
      name: size
      in: query
      description: 每页条数（默认 20，上限 200）
      schema: { type: integer, default: 20, minimum: 1, maximum: 200 }
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    RuleRejected:
      description: 规则引擎判定拒绝（比例超限 / 超预算硬拦截 / 越权），回传命中规则号与依据条款
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/RuleVerdict' }
    DuplicateInvoice:
      description: 发票三重指纹查重命中（发票号+金额+开票日期），直接拒绝
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    NotFound:
      description: 资源不存在或越权（跨租户/跨法人过滤后不可见）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    RateLimited:
      description: AI 接口限流（20 req/min）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }

  schemas:
    ApiResponse:
      type: object
      description: 统一响应包裹
      properties:
        code: { type: integer, description: '业务码，0=成功，非 0=业务错误' }
        message: { type: string }
        data: { type: object, nullable: true }
        traceId: { type: string }
        timestamp: { type: integer, format: int64 }

    PageResult:
      type: object
      properties:
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }

    Money:
      type: string
      format: number
      description: 金额（NUMERIC(18,2)，单位元）
      example: "125000.00"

    BudgetStatus:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, EXECUTING, ADJUSTING, RE_APPROVED, CLOSED]
    ExpenseStatus:
      type: string
      enum: [DRAFT, SUBMITTED, AI_REVIEW, HUMAN_REVIEW, APPROVED, REJECTED, RETURNED, PAID, VOUCHER_SYNCED]
    ClaimStatus:
      type: string
      description: 到账认领状态
      enum: [UNCLAIMED, AUTO_MATCHED, CLAIMED, DOUBTFUL]
    Severity:
      type: string
      enum: [HIGH, MED, LOW]
    BudgetMode:
      type: string
      description: 经费管理模式（字典可配，PRD 2.8）
      enum: ['预算制', '包干制']
    DisbursementStatus:
      type: string
      enum: [DRAFT, SUBMITTED, APPROVED, PAID, VOUCHER_SYNCED, REJECTED, RETURNED]
    SecurityLevel:
      type: string
      enum: [PUBLIC, INTERNAL, SECRET, TOP_SECRET]

    Subject:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        level: { type: integer }
        category: { type: string, enum: [DIRECT, INDIRECT, PERFORMANCE] }
        isLeaf: { type: boolean }
        ratioLimit: { type: number, format: double, nullable: true }
        appliesTo: { type: array, items: { type: string } }
        status: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/Subject' }

    Budget:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 'BUD-年-序' }
        projectId: { type: integer, format: int64 }
        legalEntityId: { type: integer, format: int64 }
        mode: { $ref: '#/components/schemas/BudgetMode' }
        totalApproved: { $ref: '#/components/schemas/Money' }
        totalAdjusted: { $ref: '#/components/schemas/Money' }
        version: { type: integer }
        status: { $ref: '#/components/schemas/BudgetStatus' }
        approvedAt: { type: string, format: date-time, nullable: true }
        approvedBy: { type: integer, format: int64, nullable: true }
        policyPackId: { type: integer, format: int64, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BudgetLine:
      type: object
      description: 预算行；remaining = planned + adjusted - frozen - used - released
      properties:
        id: { type: integer, format: int64 }
        budgetId: { type: integer, format: int64 }
        subjectId: { type: integer, format: int64 }
        subjectName: { type: string }
        amountPlanned: { $ref: '#/components/schemas/Money' }
        amountAdjusted: { $ref: '#/components/schemas/Money' }
        amountFrozen: { $ref: '#/components/schemas/Money' }
        amountUsed: { $ref: '#/components/schemas/Money' }
        amountReleased: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money' }
        policyPackId: { type: integer, format: int64, nullable: true }

    BudgetDetail:
      allOf:
        - $ref: '#/components/schemas/Budget'
        - type: object
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/BudgetLine' }

    BudgetCreateRequest:
      type: object
      required: [projectId, mode, totalApproved]
      properties:
        projectId: { type: integer, format: int64 }
        legalEntityId: { type: integer, format: int64 }
        mode: { $ref: '#/components/schemas/BudgetMode' }
        totalApproved: { $ref: '#/components/schemas/Money' }
        policyPackId: { type: integer, format: int64, nullable: true }
        lines:
          type: array
          description: 预算制必填按科目拆分；包干制可为空
          items:
            type: object
            required: [subjectId, amountPlanned]
            properties:
              subjectId: { type: integer, format: int64 }
              amountPlanned: { $ref: '#/components/schemas/Money' }

    BudgetAdjustRequest:
      type: object
      required: [adjustLines]
      properties:
        reason: { type: string }
        adjustLines:
          type: array
          items:
            type: object
            required: [subjectId, amountAdjustedDelta]
            properties:
              subjectId: { type: integer, format: int64 }
              amountAdjustedDelta: { $ref: '#/components/schemas/Money', description: '调整增减额，可为负' }

    BudgetBalanceResult:
      type: object
      properties:
        lineId: { type: integer, format: int64 }
        remaining: { $ref: '#/components/schemas/Money' }
        overThreshold: { type: string, enum: [NONE, SOFT_WARN, HARD_BLOCK], description: '0-5% 软警告；>5% 硬拦截' }
        overRatio: { type: number, format: double }

    Income:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        projectId: { type: integer, format: int64, nullable: true }
        receiptNo: { type: string }
        receiptDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        payerName: { type: string }
        payerBank: { type: string }
        purposeText: { type: string }
        bankFlowNo: { type: string }
        claimStatus: { $ref: '#/components/schemas/ClaimStatus' }
        matchConfidence: { type: number, format: double }
        claimedBy: { type: integer, format: int64, nullable: true }
        claimedAt: { type: string, format: date-time, nullable: true }

    IncomeRegisterRequest:
      type: object
      required: [amount, receiptDate]
      properties:
        projectId: { type: integer, format: int64, nullable: true }
        receiptNo: { type: string }
        receiptDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        payerName: { type: string }
        payerBank: { type: string }
        purposeText: { type: string }
        bankFlowNo: { type: string }

    BankFlowItem:
      type: object
      required: [bankFlowNo, amount]
      properties:
        bankFlowNo: { type: string }
        receiptDate: { type: string, format: date }
        amount: { $ref: '#/components/schemas/Money' }
        payerName: { type: string }
        payerBank: { type: string }
        purposeText: { type: string }

    BankFlowImportResult:
      type: object
      properties:
        total: { type: integer }
        autoMatched: { type: integer }
        doubtful: { type: integer }
        unclaimed: { type: integer }
        elapsedMs: { type: integer, description: '匹配耗时（目标 1 万条<60s）' }

    Invoice:
      type: object
      properties:
        id: { type: integer, format: int64 }
        number: { type: string }
        invoiceCode: { type: string }
        invoiceType: { type: string, enum: [GENERAL, SPECIAL, ELECTRONIC, ITINERARY] }
        sellerName: { type: string }
        sellerTaxId: { type: string }
        buyerName: { type: string }
        buyerTaxId: { type: string }
        amountExclTax: { $ref: '#/components/schemas/Money' }
        taxAmount: { $ref: '#/components/schemas/Money' }
        totalAmount: { $ref: '#/components/schemas/Money' }
        issueDate: { type: string, format: date }
        ocrConfidence: { type: number, format: double }
        checkResult: { type: string, enum: [PASS, FAIL, PENDING] }
        isDuplicated: { type: boolean }

    Expense:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 'EXP-年-序' }
        projectId: { type: integer, format: int64 }
        budgetLineId: { type: integer, format: int64, nullable: true }
        applicantUserId: { type: integer, format: int64 }
        amount: { $ref: '#/components/schemas/Money' }
        expenseType: { type: string, enum: [EQUIPMENT, MATERIAL, TRAVEL, MEETING, LABOR, EXPERT, OTHER] }
        submitMode: { $ref: '#/components/schemas/BudgetMode' }
        invoiceIds: { type: array, items: { type: integer, format: int64 } }
        status: { $ref: '#/components/schemas/ExpenseStatus' }
        aiVerdict: { type: string, enum: [PASS, REVIEW, REJECT], nullable: true }
        aiConfidence: { type: number, format: double, nullable: true }
        invoiceCheckStatus: { type: string, enum: [PENDING, PASSED, FAILED, MANUAL] }
        submittedAt: { type: string, format: date-time, nullable: true }
        policyPackId: { type: integer, format: int64, nullable: true }

    ExpenseDetail:
      allOf:
        - $ref: '#/components/schemas/Expense'
        - type: object
          properties:
            description: { type: string }
            invoices:
              type: array
              items: { $ref: '#/components/schemas/Invoice' }
            approvals:
              type: array
              items: { $ref: '#/components/schemas/ExpenseApproval' }
            anomalies:
              type: array
              items: { $ref: '#/components/schemas/Anomaly' }

    ExpenseApproval:
      type: object
      properties:
        id: { type: integer, format: int64 }
        expenseId: { type: integer, format: int64 }
        stepOrder: { type: integer }
        approverUserId: { type: integer, format: int64, nullable: true }
        role: { type: string }
        action: { type: string, enum: [APPROVE, REJECT, RETURN, DELEGATE] }
        comment: { type: string }
        actedAt: { type: string, format: date-time, nullable: true }

    ExpenseCreateRequest:
      type: object
      required: [projectId, amount, expenseType]
      properties:
        projectId: { type: integer, format: int64 }
        budgetLineId: { type: integer, format: int64, nullable: true }
        amount: { $ref: '#/components/schemas/Money' }
        expenseType: { type: string, enum: [EQUIPMENT, MATERIAL, TRAVEL, MEETING, LABOR, EXPERT, OTHER] }
        submitMode: { $ref: '#/components/schemas/BudgetMode' }
        description: { type: string }
        invoiceIds: { type: array, items: { type: integer, format: int64 } }
        attachmentIds: { type: array, items: { type: integer, format: int64 } }

    ApprovalActionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [APPROVE, REJECT, RETURN, DELEGATE] }
        comment: { type: string }
        delegateToUserId: { type: integer, format: int64, nullable: true, description: 'DELEGATE 时指定接手人（审批人离职自动流转）' }

    AiReviewRequest:
      type: object
      required: [expenseId]
      properties:
        expenseId: { type: integer, format: int64 }
        invoiceIds: { type: array, items: { type: integer, format: int64 } }

    AiReviewResult:
      type: object
      description: AI 仅产出建议，需人工确认；低置信回落人工（PRD 2.4/2.10）
      properties:
        verdict: { type: string, enum: [PASS, REVIEW, REJECT] }
        confidence: { type: number, format: double }
        issues:
          type: array
          items:
            type: object
            properties:
              rule: { type: string }
              reason: { type: string }
              evidence: { type: object }
              clauseRef: { type: string, description: 制度依据条款出处 }

    VoucherSync:
      type: object
      properties:
        id: { type: integer, format: int64 }
        expenseId: { type: integer, format: int64 }
        financeSystem: { type: string, enum: [YONYOU, KINGDEE, INSPIRE] }
        voucherNo: { type: string, nullable: true }
        syncStatus: { type: string, enum: [PENDING, SUCCESS, FAILED] }
        retryCount: { type: integer }
        errorMsg: { type: string, nullable: true }
        syncAt: { type: string, format: date-time, nullable: true }

    VoucherCallbackRequest:
      type: object
      required: [expenseId, result]
      properties:
        expenseId: { type: integer, format: int64 }
        result: { type: string, enum: [SUCCESS, FAILED] }
        voucherNo: { type: string }
        financeSystem: { type: string, enum: [YONYOU, KINGDEE, INSPIRE] }
        detail: { type: object }

    IndirectFee:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        projectId: { type: integer, format: int64 }
        period: { type: string, description: 'YYYYMM' }
        totalBudget: { $ref: '#/components/schemas/Money' }
        actualIncome: { $ref: '#/components/schemas/Money' }
        actualExpense: { $ref: '#/components/schemas/Money' }
        indirectRate: { type: number, format: double }
        indirectAmount: { $ref: '#/components/schemas/Money' }
        performanceRate: { type: number, format: double }
        performanceAmount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [DRAFT, CALCULATED, POSTED, REVERSED] }
        policyPackId: { type: integer, format: int64, nullable: true }

    IndirectFeeCalcRequest:
      type: object
      required: [projectId, period]
      properties:
        projectId: { type: integer, format: int64 }
        period: { type: string, description: 'YYYYMM' }
        policyPackId: { type: integer, format: int64, nullable: true }

    Settlement:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        projectId: { type: integer, format: int64 }
        closingDate: { type: string, format: date }
        incomeTotal: { $ref: '#/components/schemas/Money' }
        expenseTotal: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money' }
        treatment: { type: string, enum: ['结转', '收回', '留用'] }
        auditReportUrl: { type: string, nullable: true }
        status: { type: string, enum: [DRAFT, SUBMITTED, AUDITING, APPROVED, REJECTED] }

    Disbursement:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 'DISB-年-序' }
        contractId: { type: integer, format: int64 }
        outsourceUnitId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        amount: { $ref: '#/components/schemas/Money' }
        phase: { type: string, enum: ['预付', '进度', '尾款'] }
        voucherStatus: { type: string, enum: [PENDING, SUCCESS, FAILED, MANUAL] }
        contractAmount: { $ref: '#/components/schemas/Money' }
        remainContractAmount: { $ref: '#/components/schemas/Money' }
        complianceFlags: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/DisbursementStatus' }
        policyPackId: { type: integer, format: int64, nullable: true }

    DisbursementCreateRequest:
      type: object
      required: [contractId, outsourceUnitId, projectId, amount, phase]
      properties:
        contractId: { type: integer, format: int64, description: '逻辑引用 G_CONTRACT(id)' }
        outsourceUnitId: { type: integer, format: int64, description: '逻辑引用 G_SUPPLIER(id)' }
        projectId: { type: integer, format: int64 }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        amount: { $ref: '#/components/schemas/Money' }
        phase: { type: string, enum: ['预付', '进度', '尾款'] }
        invoiceUrl: { type: string }

    DisbursementCheckResult:
      type: object
      properties:
        contractId: { type: integer, format: int64 }
        contractAmount: { $ref: '#/components/schemas/Money' }
        disbursedBefore: { $ref: '#/components/schemas/Money' }
        remainContractAmount: { $ref: '#/components/schemas/Money' }
        canDisburse: { type: boolean }
        complianceFlags: { type: array, items: { type: string } }
        ruleHits:
          type: array
          items: { $ref: '#/components/schemas/RuleVerdict' }

    CostPool:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        projectId: { type: integer, format: int64 }
        period: { type: string }
        directCost: { $ref: '#/components/schemas/Money' }
        indirectAlloc:
          type: array
          items:
            type: object
            properties:
              type: { type: string, description: '管理费/房屋/水电气/设备折旧/共用平台' }
              basis: { type: string, description: 分摊依据（可复算） }
              amount: { $ref: '#/components/schemas/Money' }
        fullCost: { $ref: '#/components/schemas/Money' }
        basisRuleId: { type: integer, format: int64, nullable: true }
        policyPackId: { type: integer, format: int64, nullable: true }

    AccountingEntry:
      type: object
      description: 平行记账双分录（《政府会计制度》，F-21）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        sourceTxnId: { type: integer, format: int64 }
        sourceTxnType: { type: string, enum: [EXPENSE, INCOME, DISBURSEMENT, DEPRECIATION, INDIRECT] }
        projectId: { type: integer, format: int64 }
        period: { type: string }
        finEntry:
          type: object
          description: 财务会计分录（权责发生制，借贷明细）
        budEntry:
          type: object
          description: 预算会计分录（收付实现制，预算支出/资金结存）
        postedFinance: { type: boolean }
        postedBudget: { type: boolean }
        reconcileStatus: { type: string, enum: [BALANCED, UNRECONCILED, SUSPENSE] }
        voucherSyncId: { type: integer, format: int64, nullable: true }
        policyPackId: { type: integer, format: int64, nullable: true }

    Anomaly:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        expenseId: { type: integer, format: int64, nullable: true }
        projectId: { type: integer, format: int64, nullable: true }
        anomalyType: { type: string, enum: [SPLIT, RUSH_SPEND, ABNORMAL_SUBJECT, CIRCULAR, SENSITIVE_CATEGORY, BUDGET_OVER, OTHER] }
        ruleCode: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        reasonText: { type: string }
        evidence: { type: object }
        aiConfidence: { type: number, format: double }
        falsePositive: { type: boolean }
        status: { type: string, enum: [OPEN, PROCESSING, RESOLVED, FALSE_POSITIVE, CLOSED] }

    BudgetForecast:
      type: object
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        snapshotDate: { type: string, format: date }
        currentExecutionRate: { type: number, format: double }
        expectedExecutionRate: { type: number, format: double }
        deviation: { type: number, format: double }
        deviationAlert: { type: boolean }
        suggestion: { type: string }
        modelVersion: { type: string }

    FundingDashboard:
      type: object
      description: 经费监督大屏聚合（一图一舱三预警，只读 OLAP 投影，刷新<5s）
      properties:
        totalBudget: { $ref: '#/components/schemas/Money' }
        yearIncome: { $ref: '#/components/schemas/Money' }
        executionRate: { type: number, format: double }
        violationCount: { type: integer }
        deptHeatmap:
          type: array
          items:
            type: object
            properties:
              departmentId: { type: integer, format: int64 }
              executionRate: { type: number, format: double }
              amount: { $ref: '#/components/schemas/Money' }
        trend12Months:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              executionRate: { type: number, format: double }
        alerts:
          type: object
          properties:
            pre: { type: array, items: { type: object } }
            during: { type: array, items: { type: object } }
            post: { type: array, items: { type: object } }

    RuleVerdict:
      type: object
      description: svc-policy 规则引擎命中结果（可解释、可复算，PRD 2.10）
      properties:
        ruleCode: { type: string }
        clauseRef: { type: string, description: 制度出处条款 }
        verdict: { type: string, enum: [PASS, REJECT, WARN] }
        policyPackId: { type: integer, format: int64, nullable: true }
        detail: { type: object }

    FundingExecution:
      type: object
      description: 项目经费执行率聚合（金额为 NUMERIC 字符串承载，PRD 2.6）
      properties:
        projectId: { type: integer, format: int64 }
        budgetApproved: { $ref: '#/components/schemas/Money' }
        budgetAdjusted: { $ref: '#/components/schemas/Money' }
        incomeTotal: { $ref: '#/components/schemas/Money' }
        used: { $ref: '#/components/schemas/Money' }
        frozen: { $ref: '#/components/schemas/Money' }
        remaining: { $ref: '#/components/schemas/Money' }
        execRateByBudget: { type: number, format: double, description: used / 批复总额 }
        execRateByIncome: { type: number, format: double, description: used / 认领到账总额 }

    FundingWarning:
      type: object
      description: 经费执行预警（惰性计算，不落库）
      properties:
        projectId: { type: integer, format: int64 }
        projectCode: { type: string }
        projectName: { type: string }
        level: { type: string, enum: [WARN, CRITICAL, DEADLINE_RISK], description: WARN=执行率≥80%；CRITICAL=≥100%；DEADLINE_RISK=结题窗口30天内且执行率<100% }
        execRate: { type: number, format: double }
        deadline: { type: string, format: date, nullable: true, description: 结题/验收截止日期 }
        message: { type: string }
    Outward:
      type: object
      description: 经费外拨单（T14）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        projectId: { type: integer, format: int64 }
        budgetLineId: { type: integer, format: int64, nullable: true }
        amount: { $ref: '#/components/schemas/Money' }
        toUnit: { type: string }
        reason: { type: string, nullable: true }
        firstApprovedBy: { type: integer, format: int64, nullable: true }
        approvedBy: { type: integer, format: int64, nullable: true }
        createdAt: { type: string }

    Carryover:
      type: object
      description: 结转单（T14；仅 CLOSED 项目可发起）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        projectId: { type: integer, format: int64 }
        fiscalYear: { type: integer }
        targetYear: { type: integer }
        amount: { $ref: '#/components/schemas/Money' }
        incomeId: { type: integer, format: int64, nullable: true }
        remark: { type: string, nullable: true }
        createdAt: { type: string }

    SubjectUpsert:
      type: object
      description: 科目创建/更新请求（T15；update 仅 name/ratioLimit/sortNo/remark 生效）
      properties:
        code: { type: string, nullable: true }
        name: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        category: { type: string, enum: [DIRECT, INDIRECT, PERFORMANCE] }
        isLeaf: { type: boolean, default: true }
        ratioLimit: { type: string, nullable: true, description: 上限比例 NUMERIC 字符串 }
        appliesTo:
          type: array
          nullable: true
          items: { type: string }
        sortNo: { type: integer, format: int32, nullable: true }
        remark: { type: string, nullable: true }

    FSubject:
      type: object
      description: 经费科目（T15）
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, nullable: true }
        name: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        level: { type: integer }
        category: { type: string }
        isLeaf: { type: boolean }
        ratioLimit: { type: string, nullable: true }
        appliesTo:
          type: array
          items: { type: string }
        sortNo: { type: integer, format: int32, nullable: true }

    SubjectNode:
      type: object
      description: 科目树节点（T15；children 递归）
      allOf:
        - $ref: '#/components/schemas/FSubject'
        - type: object
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/SubjectNode' }

    WarnConfigUpsert:
      type: object
      description: 预警配置创建/更新请求（T15）
      properties:
        projectCategoryId: { type: integer, format: int64, nullable: true }
        warnKind: { type: string, enum: [EXEC_RATE, DEADLINE, ANNUAL_FEE, MIDCHECK, CLOSING] }
        thresholdPct: { type: string, nullable: true }
        aheadDays: { type: integer, format: int32, nullable: true }
        level: { type: string, default: P2 }
        channel: { type: string, enum: [INBOX, cron], default: INBOX }
        cronExpr: { type: string, nullable: true }
        template: { type: string, nullable: true, description: "消息模板，支持 {project}/{date} 占位" }
        enabled: { type: boolean, default: true }
        remark: { type: string, nullable: true }

    WarnConfig:
      type: object
      description: 经费预警配置（T15；T24 接入 T18/T21 扫描）
      properties:
        id: { type: integer, format: int64 }
        warnKind: { type: string }
        projectCategoryId: { type: integer, format: int64, nullable: true }
        thresholdPct: { type: string, nullable: true }
        aheadDays: { type: integer, format: int32, nullable: true }
        level: { type: string }
        channel: { type: string }
        cronExpr: { type: string, nullable: true }
        template: { type: string, nullable: true }
        enabled: { type: boolean }
        remark: { type: string, nullable: true }
        createdAt: { type: string }

