openapi: 3.0.3
info:
  title: 科研经费管理 · 模块 F 接口契约
  description: |
    科研院所科研管理系统 M1 核心模块【03 科研经费管理（代号 F）】对外 REST 契约。
    覆盖预算编制/调整、到账登记与银行流水匹配、报销（含发票 OCR 上传）、AI 发票审核、
    多级审批、预算冻结与余额查询、凭证同步（财务系统回调）、间接费用计提、项目决算、
    外拨经费（联动 G 合同）、全成本分摊查询、平行记账分录查询、经费监督大屏聚合。
    术语 / 状态 token / 单号前缀（BUD/EXP/DISB）以 design/README.md、PRD/README.md 为准。
    统一响应包裹 { code, message, data, traceId, timestamp }；分页 page(1-based)+size(默认20,上限200)；
    认证 Bearer JWT；所有 POST/PUT 支持 Idempotency-Key 请求头（UUID，服务端去重）。
    金额以 string(format:number) 承载 NUMERIC(18,2)；比例/置信度 number(0-1)。
  version: "1.1.0"
  contact:
    name: 研发组
servers:
  - url: /api/v1
    description: 经费服务 svc-funding 网关前缀（多租户经 JWT 解析注入）
security:
  - bearerAuth: []
tags:
  - name: Subject
    description: F-01 经费科目字典（树形）
  - name: Budget
    description: F-02/F-03/F-04 预算编制（预算制/包干制）与调整批复
  - name: Income
    description: F-05/F-06 到账登记与银行流水自动匹配、认领
  - name: Expense
    description: F-07/F-09 报销创建、提交、多级审批；F-10 预算冻结与余额
  - name: Invoice
    description: F-08 发票 OCR 结构化与三重指纹查重
  - name: AIReview
    description: F-15/F-16 AI 发票审核与违规识别（仅建议，不自动决策）
  - name: Voucher
    description: F-11 凭证同步（下发 + 财务系统回调）
  - name: IndirectFee
    description: F-12 间接费用与绩效支出计提
  - name: Settlement
    description: F-13 项目决算与结转结余
  - name: Disbursement
    description: F-22 外拨经费（联动 G 合同金额上限拦截）
  - name: CostPool
    description: F-20 项目全成本核算与分摊查询
  - name: AccountingEntry
    description: F-21 政府会计制度平行记账双分录查询
  - name: Anomaly
    description: F-16 异常与违规预警处置
  - name: Forecast
    description: F-17 AI 执行率预测快照查询
  - name: Dashboard
    description: F-18 经费监督大屏数据聚合查询

  - name: WarnConfig
    description: F-19 经费预警配置（T15/T24；channel=cron 按 template 渲染）
paths:
  /outwards:
    post:
      tags: [Disbursement]
      summary: 创建经费外拨单（T14，联动 G 合同金额上限拦截）
      operationId: createOutward
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, amount, toUnit]
              properties:
                projectId: { type: integer, format: int64 }
                budgetId: { type: integer, format: int64, nullable: true }
                budgetLineId: { type: integer, format: int64, nullable: true }
                amount: { $ref: '#/components/schemas/Money' }
                toUnit: { type: string }
                reason: { type: string, nullable: true }
      responses:
        "200":
          description: 外拨单（status=PENDING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Outward' }
    get:
      tags: [Disbursement]
      summary: 分页查询外拨单
      operationId: listOutwards
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/Outward' }

  /outwards/{id}/approval:
    post:
      tags: [Disbursement]
      summary: 外拨单审批（R-LEADER/R-ADMIN；action=APPROVE|REJECT）
      operationId: outwardApproval
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                comment: { type: string, nullable: true }
      responses:
        "200":
          description: 审批后单据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Outward' }

  /carryovers:
    post:
      tags: [Settlement]
      summary: 创建结转单（T14；仅 CLOSED 项目，targetYear > fiscalYear）
      operationId: createCarryover
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, fiscalYear, targetYear, amount]
              properties:
                projectId: { type: integer, format: int64 }
                fiscalYear: { type: integer }
                targetYear: { type: integer }
                amount: { $ref: '#/components/schemas/Money' }
                remark: { type: string, nullable: true }
      responses:
        "200":
          description: 结转单（status=PENDING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Carryover' }
    get:
      tags: [Settlement]
      summary: 分页查询结转单
      operationId: listCarryovers
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        "200":
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/Carryover' }

  /carryovers/{id}/approval:
    post:
      tags: [Settlement]
      summary: 结转单审批（action=APPROVE|REJECT）
      operationId: carryoverApproval
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
      responses:
        "200":
          description: 审批后单据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Carryover' }

  /budgets/{id}/append:
    post:
      tags: [Budget]
      summary: 预算追加申请（T14；仅 EXECUTING 预算，行级 delta 汇总置 ADJUSTING）
      operationId: appendBudget
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [lineId, delta]
                    properties:
                      lineId: { type: integer, format: int64 }
                      delta: { $ref: '#/components/schemas/Money' }
                      reason: { type: string, nullable: true }
      responses:
        "200":
          description: 追加申请受理（budgetId + pendingDelta）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          budgetId: { type: integer, format: int64 }
                          pendingDelta: { $ref: '#/components/schemas/Money' }

  /budgets/{id}/append/approve:
    post:
      tags: [Budget]
      summary: 预算追加批复（T14；R-LEADER；仅 ADJUSTING 状态）
      operationId: approveBudgetAppend
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 批复后预算（totalApproved 累加 pendingDelta，version+1）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Budget' }

  /subjects/tree:
    get:
      tags: [Subject]
      summary: 查询科目树（含多级 children 嵌套，T15）
      operationId: subjectsTree
      responses:
        "200":
          description: 多级科目树
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SubjectNode' }

  /subjects:
    post:
      tags: [Subject]
      summary: 新建科目（T15；parent_id 缺省为顶级 level=1）
      operationId: createSubject
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectUpsert' }
      responses:
        "200":
          description: 科目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FSubject' }

  /subjects/{id}:
    put:
      tags: [Subject]
      summary: 更新科目（T15；局部更新 name/ratioLimit/sortNo/remark）
      operationId: updateSubject
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectUpsert' }
      responses:
        "200":
          description: 更新后科目
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FSubject' }
    delete:
      tags: [Subject]
      summary: 删除科目（T15；有子级/被预算引用禁止删除）
      operationId: deleteSubject
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }
        "409": { $ref: '#/components/responses/RuleRejected' }

  /funding/warn-configs:
    get:
      tags: [WarnConfig]
      summary: 分页查询预警配置（T15；query warnKind/enabled 过滤）
      operationId: listWarnConfigs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: warnKind
          in: query
          schema: { type: string, enum: [EXEC_RATE, DEADLINE, ANNUAL_FEE, MIDCHECK, CLOSING] }
        - name: enabled
          in: query
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/WarnConfig' }
    post:
      tags: [WarnConfig]
      summary: 新建预警配置（T15；channel=cron 时按 template 渲染推送）
      operationId: createWarnConfig
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarnConfigUpsert' }
      responses:
        "200":
          description: 预警配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WarnConfig' }

  /funding/warn-configs/{id}:
    put:
      tags: [WarnConfig]
      summary: 更新预警配置（T15；空值不覆盖）
      operationId: updateWarnConfig
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarnConfigUpsert' }
      responses:
        "200":
          description: 更新后配置
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WarnConfig' }
    delete:
      tags: [WarnConfig]
      summary: 删除预警配置（T15）
      operationId: deleteWarnConfig
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 删除结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }

  /expenses/approval-batch:
    post:
      tags: [Expense]
      summary: 报销批量审批（T19；逐条独立事务，部分失败不影响其余）
      operationId: approvalBatch
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items: { type: integer, format: int64 }
                action: { type: string, enum: [APPROVE, REJECT, RETURN] }
                comment: { type: string }
      responses:
        "200":
          description: 批量结果（total/ok/逐条 results，含单条错误信息）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total: { type: integer }
                          ok: { type: integer }
                          results:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: integer, format: int64 }
                                ok: { type: boolean }
                                err: { type: string, nullable: true }

  /subjects:
    get:
      tags: [Subject]
      summary: 查询经费科目树（按项目类型过滤）
      operationId: listSubjects
      parameters:
        - name: projectType
          in: query
          schema: { type: string }
          description: 项目类型（对齐 sys_dict project_type），过滤 applies_to
        - name: category
          in: query
          schema: { type: string, enum: [DIRECT, INDIRECT, PERFORMANCE] }
      responses:
        "200":
          description: 科目树
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Subject' }

  /budgets:
    post:
      tags: [Budget]
      summary: 编制项目预算（预算制/包干制，F-02/F-03）
      operationId: createBudget
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetCreateRequest' }
      responses:
        "200":
          description: 返回预算（status=DRAFT）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Budget' }
        "422": { $ref: '#/components/responses/RuleRejected' }
    get:
      tags: [Budget]
      summary: 分页查询预算列表
      operationId: pageBudgets
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: projectId
          in: query
          schema: { type: integer, format: int64 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BudgetStatus' }
      responses:
        "200":
          description: 分页结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageResult'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/Budget' }

  /budgets/{budgetId}:
    get:
      tags: [Budget]
      summary: 查询预算详情（含明细行余额）
      operationId: getBudget
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        "200":
          description: 预算详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BudgetDetail' }
        "404": { $ref: '#/components/responses/NotFound' }

  /budgets/{budgetId}/submit:
    post:
      tags: [Budget]
      summary: 提交预算批复（DRAFT→SUBMITTED→UNDER_REVIEW）
      operationId: submitBudget
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        "200":
          description: 提交结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        "422": { $ref: '#/components/responses/RuleRejected' }

  /budgets/{budgetId}/approve:
    post:
      tags: [Budget]
      summary: 批复预算（UNDER_REVIEW→APPROVED→EXECUTING）
      operationId: approveBudget
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                comment: { type: string }
      responses:
        "200":
          description: 批复结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /budgets/{budgetId}/adjust:
    post:
      tags: [Budget]
      summary: 预算调整（EXECUTING→ADJUSTING→RE_APPROVED，生成新版本，F-04）
      operationId: adjustBudget
      parameters:
        - $ref: '#/components/parameters/BudgetId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetAdjustRequest' }
      responses:
        "200":
          description: 调整申请（新 version，status=ADJUSTING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Budget' }
        "422": { $ref: '#/components/responses/RuleRejected' }

  /budgets/{budgetId}/lines:
    get:
      tags: [Budget]
      summary: 查询预算明细行余额（冻结/已用/可支，F-10）
      operationId: listBudgetLines
      parameters:
        - $ref: '#/components/parameters/BudgetId'
      responses:
        "200":
          description: 明细行列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BudgetLine' }

  /budget-lines/{lineId}/balance:
    get:
      tags: [Expense]
      summary: 预算行可支余额实时查询（供报销前端联动校验，F-07/F-10）
      operationId: getBudgetLineBalance
      parameters:
        - name: lineId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 余额与超支阈值判定
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BudgetBalanceResult' }

  /incomes:
    post:
      tags: [Income]
      summary: 登记经费到账（F-05）
      operationId: createIncome
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeRegisterRequest' }
      responses:
