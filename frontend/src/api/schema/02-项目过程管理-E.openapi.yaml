        triggerSource: { type: string, enum: [ETL, EVENT] }

    ERiskWarning:
      type: object
      description: AI 风险预警（E-11）
      properties:
        warningId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        level: { $ref: '#/components/schemas/RiskLevel' }
        source: { type: string, enum: [RULE, XGBOOST, LLM], description: 确定性规则/预测模型/大模型归因 }
        ruleCode: { type: string, description: 命中规则号（可解释） }
        title: { type: string }
        suggestion: { type: string, description: LLM 生成的建议动作（自然语言） }
        detectedAt: { type: string, format: date-time }
        disposition: { type: string, enum: [PENDING, ACK, FALSE_POSITIVE] }

    EArchiveChecklist:
      type: object
      description: 归档清单实例（对应 E_ARCHIVE_CHECKLIST）
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        projectType: { type: string }
        stage: { $ref: '#/components/schemas/ArchiveStage' }
        checklistJson:
          type: array
          items:
            type: object
            properties:
              item: { type: string }
              required: { type: boolean }
              mime: { type: string }
