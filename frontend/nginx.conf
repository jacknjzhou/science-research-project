# 前端容器 nginx：托管 SPA 静态资源 + 同源反代后端 API。
# 前端 client.ts 走相对路径 /api/v1，经此反代到 compose 服务名 backend:8787，
# 单源部署，天然规避浏览器跨域（后端本身 CORS origin:true 作兜底）。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 传输压缩
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Vite 产物带内容 hash，可长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API 反代：/api/v1/... → http://backend:8787/api/v1/...（proxy_pass 不带 URI，原样透传路径）
  location /api/ {
    proxy_pass http://backend:8787;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
  }

  # 自检接口也透传到后端（可选，方便从前端口探活）
  location = /healthz {
    proxy_pass http://backend:8787/healthz;
  }

  # index.html 永远协商缓存（no-cache）：bundle 文件名带内容 hash 可长缓存，
  # 但入口 HTML 若被浏览器启发式缓存，重新部署后用户会一直跑到旧 JS（症状：新功能"不生效/点不动"）。
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  # SPA 回退（本项目 hash 路由为主，保留以兼容 history 模式）
  location / {
    try_files $uri $uri/ /index.html;
  }
}
