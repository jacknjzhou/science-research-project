run:
  timeout: 5m
  tests: true
linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gofmt
    - goimports
    - misspell
issues:
  exclude-rules:
    # 生成的 DAL/DTO 不参与人工 lint（由 codegen 守卫保证一致）
    - path: internal/modules/p/store
      linters: [errcheck, govet, staticcheck]
    - path: api/gen
      linters: [errcheck, govet, staticcheck]
