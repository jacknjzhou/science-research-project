version: "2"
sql:
  - engine: "postgresql"
    # schema: "migrations/000001_init.up.sql"  # 完整迁移（~394KB）会令 sqlc v1.27.0 wazero 解析器 OOM 崩溃
    schema: "db/schema/p_schema.sql"           # 裁剪至 P 仓储所需表（p_application + p_guideline + p_template），语句原样摘自迁移
    queries: "db/query"
    gen:
      go:
        package: "store"
        out: "internal/modules/p/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        rename:
          p_application: Application
          "@limit_": Limit
          "@offset_": Offset
        overrides:
          # pgx/v5 默认把 timestamptz→pgtype.Timestamptz、numeric→pgtype.Numeric，
          # 且 db_type 级 override 会被 sql_package 内建映射覆盖；故改用列级 override 精确对齐契约/Task7：
          #   timestamps → time.Time / *time.Time；total_budget → string（NUMERIC 经 SELECT ::text 已是 string，
          #   这里把 model.Application.total_budget 也固定为 string 以满足字段类型要求）。
          - column: "p_application.created_at"
            go_type: "time.Time"
          - column: "p_application.updated_at"
            go_type: "time.Time"
          - column: "p_application.submit_at"
            go_type:
              type: "time.Time"
              pointer: true
          - column: "p_application.withdraw_at"
            go_type:
              type: "time.Time"
              pointer: true
          - column: "p_application.total_budget"
            go_type: "string"
  - engine: "postgresql"
    # 第二生成块：U 仓储。独立 schema/queries/out，与 P 块并存；package=sysstore。
    schema: "db/schema/sys_schema.sql"
    queries: "db/query_sys"
    gen:
      go:
        package: "sysstore"
        out: "internal/modules/sysadmin/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        rename:
          sys_user: SysUser
          sys_role: SysRole
          sys_user_role: SysUserRole
          "@limit_": Limit
          "@offset_": Offset
        overrides:
          - column: "sys_user.created_at"
            go_type: "time.Time"
          - column: "sys_user.updated_at"
            go_type: "time.Time"
          - column: "sys_user.legal_entity_id"
            go_type:
              type: "int64"
              pointer: true
          - column: "sys_user.modifier_id"
            go_type:
              type: "int64"
              pointer: true
          - column: "sys_role.created_at"
            go_type: "time.Time"
          - column: "sys_role.updated_at"
            go_type: "time.Time"
          - column: "sys_user_role.granted_at"
            go_type: "time.Time"
          - column: "sys_user_role.expires_at"
            go_type:
              type: "time.Time"
              pointer: true
  - engine: "postgresql"
    # 第三生成块：V 仓储（学术活动）。独立 schema/queries/out；package=vstore。
    schema: "db/schema/v_schema.sql"
    queries: "db/query_v"
    gen:
      go:
        package: "vstore"
        out: "internal/modules/activity/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        rename:
          v_activity: Activity
          "@limit_": Limit
          "@offset_": Offset
        overrides:
          # created_at/updated_at → time.Time；可空时间列 → *time.Time；NUMERIC budget_amount 保 string
          - column: "v_activity.created_at"
            go_type: "time.Time"
          - column: "v_activity.updated_at"
            go_type: "time.Time"
          - column: "v_activity.start_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "v_activity.end_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "v_activity.submit_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "v_activity.approve_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "v_activity.archive_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "v_activity.cancel_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "v_activity.budget_amount"
            go_type: "string"
          - column: "v_activity_participant.created_at"
            go_type: "time.Time"
          - column: "v_activity_review.acted_at"
            go_type: "time.Time"
  - engine: "postgresql"
    # 第四生成块：M 仓储（绩效评价）。独立 schema/queries/out；package=mstore。
    # 跨读 R/F/E/T 的最小列已并入 m_schema.sql（仅编译期解析用，运行时打真库）。
    schema: "db/schema/m_schema.sql"
    queries: "db/query_m"
    gen:
      go:
        package: "mstore"
        out: "internal/modules/performance/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        rename:
          m_scheme: Scheme
          m_scheme_factor: SchemeFactor
          m_record: Record
          m_record_item: RecordItem
          m_payout: Payout
          "@limit_": Limit
          "@offset_": Offset
        overrides:
          # 时间戳 → time.Time/*time.Time（供 mapper fmtTime/fmtTimePtr 直接吃）。
          # 关键：NUMERIC 列**不做** →string override——保持 sqlc/pgx 原生 pgtype.Numeric。
          # 原因见下注：entity 查询用 SELECT */RETURNING *（返回 model），若把 NUMERIC 钉成
          # string 会让 model 字段变 string，而 `SELECT *` 回传 numeric OID，pgx 向 string 扫描未经验证；
          # 保持 pgtype.Numeric（原生可空类型，扫描恒安全），金额→契约 string 在 mapper 用 numDec() 格式化。
          - column: "m_scheme.created_at"
            go_type: "time.Time"
          - column: "m_scheme.updated_at"
            go_type: "time.Time"
          - column: "m_scheme_factor.created_at"
            go_type: "time.Time"
          - column: "m_scheme_factor.updated_at"
            go_type: "time.Time"
          - column: "m_record.created_at"
            go_type: "time.Time"
          - column: "m_record.updated_at"
            go_type: "time.Time"
          - column: "m_record.calc_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "m_record.confirmed_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "m_record.approve_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "m_record_item.created_at"
            go_type: "time.Time"
          - column: "m_payout.created_at"
            go_type: "time.Time"
          - column: "m_payout.updated_at"
            go_type: "time.Time"
          - column: "m_payout.approved_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "m_payout.paid_at"
            go_type: { type: "time.Time", pointer: true }
  - engine: "postgresql"
    schema: "db/schema/e_schema.sql"
    queries: "db/query_e"
    gen:
      go:
        package: "estore"
        out: "internal/modules/project/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        rename:
          e_project: Project
          e_task: Task
          e_milestone: Milestone
          e_progress_report: ProgressReport
          e_mid_check: MidCheck
          e_change_request: ChangeRequest
          e_final_accept: FinalAccept
          e_health_history: HealthHistory
          "@limit_": Limit
          "@offset_": Offset
        overrides:
          - column: "e_project.created_at"
            go_type: "time.Time"
          - column: "e_project.updated_at"
            go_type: "time.Time"
          - column: "e_progress_report.submitted_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "e_progress_report.created_at"
            go_type: "time.Time"
          - column: "e_mid_check.created_at"
            go_type: "time.Time"
          - column: "e_change_request.created_at"
            go_type: "time.Time"
          - column: "e_final_accept.created_at"
            go_type: "time.Time"
          - column: "e_milestone.due_date"
            go_type: { type: "pgtype.Date" }
          - column: "e_milestone.actual_date"
            go_type: { type: "pgtype.Date" }
  - engine: "postgresql"
    # 第五生成块：R 仓储（科研成果）。独立 schema/queries/out；package=rstore。
    # 铁律（Phase 1 血泪教训）：DDL 里 CREATE TABLE R_OUTPUT 未加引号，sqlc 解析时折成小写存内部标识符，
    # 故 rename/overrides 的 key 必须小写；大写 key 静默 no-op，model 会落到默认驼峰 ROutput 而非 Output。
    schema: "db/schema/r_schema.sql"
    queries: "db/query_r"
    gen:
      go:
        package: "rstore"
        out: "internal/modules/output/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        rename:
          r_output: Output
          r_claim_record: ClaimRecord
          r_output_project: OutputProject
          r_metric_snapshot: MetricSnapshot
          "@limit_": Limit
          "@offset_": Offset
        overrides:
          # created_at/updated_at → time.Time（供 mapper fmtTime 直接吃）；action_at 同理。
          # NUMERIC（match_confidence/contribution_pct/impact_factor/confidence）保持原生 pgtype.Numeric，
          # 金额/置信度→契约 string 在 mapper 用 numStrOrNil() 处理（勿在 sqlc 层钉 string）。
          # DATE（publish_date）保持 pgtype.Date（mapper dateStr）。
          - column: "r_output.created_at"
            go_type: "time.Time"
          - column: "r_output.updated_at"
            go_type: "time.Time"
          - column: "r_claim_record.created_at"
            go_type: "time.Time"
          - column: "r_claim_record.updated_at"
            go_type: "time.Time"
          - column: "r_claim_record.action_at"
            go_type: "time.Time"
  - engine: "postgresql"
    # 第六生成块：N 仓储（专家与评审）。独立 schema/queries/out；package=nstore。
    # 铁律（Phase 1 血泪教训）：DDL 里 CREATE TABLE n_expert 未加引号，sqlc 解析折成小写，
    # 故 rename/overrides 的 key 必须小写（n_expert/n_review_task...）；大写 key 静默 no-op。
    schema: "db/schema/n_schema.sql"
    queries: "db/query_n"
    gen:
      go:
        package: "nstore"
        out: "internal/modules/expertreview/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        rename:
          n_expert: Expert
          n_expert_group: ExpertGroup
          n_review_task: ReviewTask
          n_review_invitation: Invitation
          n_review_score: Score
          n_review_fee: ReviewFee
          "@limit_": Limit
          "@offset_": Offset
        overrides:
          - column: "n_expert.created_at"
            go_type: "time.Time"
          - column: "n_expert.updated_at"
            go_type: "time.Time"
          - column: "n_expert.last_review_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "n_review_task.created_at"
            go_type: "time.Time"
          - column: "n_review_task.updated_at"
            go_type: "time.Time"
          - column: "n_review_task.drawn_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "n_review_task.started_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "n_review_task.concluded_at"
            go_type: { type: "time.Time", pointer: true }
          # DDL 校正：字符串形式 `go_type: "pgtype.Numeric"` 会让 sqlc v1.27.0 生成非法
          # `import "pgtype"`（package not in std）。改用与 E 块同款结构化形式（type + 依赖 sql_package 的 pgtype）。
          - column: "n_review_score.total_score"
            go_type: { type: "pgtype.Numeric" }
          - column: "n_review_fee.amount"
            go_type: { type: "pgtype.Numeric" }
  - engine: "postgresql"
    # 第七生成块：O 仓储（科研档案）。独立 schema/queries/out；package=ostore。
    # 铁律（Phase 1 血泪教训）：DDL 里 CREATE TABLE o_document 未加引号，sqlc 解析折小写，
    # 故 rename/overrides 的 key 必须小写（o_document/o_archive...）；大写 key 静默 no-op。
    # o_schema.sql 由 awk 从迁移抽出（仅 5 张表定义，CREATE INDEX 行被丢弃，避免
    # to_tsvector/gin_trgm_ops 表达式索引令 sqlc 解析报错；表达式索引仍保留在迁移真源）。
    schema: "db/schema/o_schema.sql"
    queries: "db/query_o"
    gen:
      go:
        package: "ostore"
        out: "internal/modules/archive/store"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        rename:
          o_document: Document
          o_archive: Archive
          o_archive_item: ArchiveItem
          o_archive_check: ArchiveCheck
          o_borrow: Borrow
          "@limit_": Limit
          "@offset_": Offset
        overrides:
          # 时间戳 → time.Time/*time.Time（供 mapper fmtTime/timePtrStr 直接吃）；
          # size_bytes BIGINT 可空 → *int64。detail JSONB 无需 override——sqlc 默认映射 []byte
          # （同 E/M/N 块其它 jsonb 列），且 go_type: "[]byte" 会被 sqlc 当 import 路径拒绝。
          - column: "o_document.created_at"
            go_type: "time.Time"
          - column: "o_document.updated_at"
            go_type: "time.Time"
          - column: "o_document.uploaded_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "o_document.size_bytes"
            go_type: { type: "int64", pointer: true }
          - column: "o_archive.created_at"
            go_type: "time.Time"
          - column: "o_archive.updated_at"
            go_type: "time.Time"
          - column: "o_archive.submit_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "o_archive.filed_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "o_borrow.created_at"
            go_type: "time.Time"
          - column: "o_borrow.updated_at"
            go_type: "time.Time"
          - column: "o_borrow.approved_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "o_borrow.due_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "o_borrow.returned_at"
            go_type: { type: "time.Time", pointer: true }
          - column: "o_archive_check.checked_at"
            go_type: { type: "time.Time", pointer: true }
