[project]
name = "ark-django"
version = "0.1.0"
description = "科研管理系统 Django 后端（方案C：Django 主体 + FastAPI AI 微服务）"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0,<6.0",
    "django-ninja>=1.3",
    "pyjwt>=2.8",
    "casbin>=1.36",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "fakeredis>=2.21",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
